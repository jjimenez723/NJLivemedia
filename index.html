<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NJ Live Media</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f1e8;
      --card: #ffffff;
      --text: #1f1a17;
      --shadow: 0 20px 50px rgba(31, 26, 23, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(173, 137, 93, 0.18), transparent 35%),
        linear-gradient(180deg, #fcfaf5 0%, var(--bg) 100%);
      color: var(--text);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      padding: 24px;
    }

    main {
      width: min(100%, 1100px);
      background: var(--card);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
    }
  </style>
</head>
<body>
  <main>
    <img src="NJ.png" alt="NJ Live Media pricing services">
  </main>
</body>
</html>
